<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Military Flight Desk for MSFS</title>
    <meta name="description" content="Tactical flight dispatch and mission planning desk for Microsoft Flight Simulator 2020 and 2024 peacetime military sorties." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="Military Flight Desk for MSFS" />
    <meta property="og:description" content="Tactical flight dispatch and mission planning desk for Microsoft Flight Simulator 2020 and 2024 peacetime military sorties." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  <script>
      // Apply the saved theme before the first paint (no flash of the wrong theme)
      try {
        var s = JSON.parse(localStorage.getItem('mfd.settings') || '{}');
        document.documentElement.setAttribute('data-theme', s.theme === 'night' ? 'night' : 'day');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'day');
      }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
