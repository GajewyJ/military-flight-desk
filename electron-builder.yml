appId: com.militaryflightdesk.msfs
productName: Military Flight Desk
copyright: Copyright © 2026

directories:
  output: release
  buildResources: public

files:
  - dist/**/*
  - electron/**/*
  - package.json

asar: true

# Auto-update source: the assets of the latest GitHub release.
publish:
  provider: github
  owner: GajewyJ
  repo: military-flight-desk

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  fileAssociations:
    - ext: pln
      name: Microsoft Flight Simulator Flight Plan
      role: Editor
    - ext: lnmpln
      name: Little Navmap Flight Plan
      role: Editor

portable:
  artifactName: ${name}-portable-${version}.${ext}

nsis:
  artifactName: ${name}-setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Military Flight Desk
