<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded rectangle with safe padding -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Subtle Tactical HUD grid ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />

  <!-- Tactical HUD tick marks -->
  <line x1="256" y1="46" x2="256" y2="76" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="436" x2="256" y2="466" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="256" x2="76" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="436" y1="256" x2="466" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Center tactical pitch ladder / brackets -->
  <path d="M 140 230 L 160 230 L 160 250" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 372 230 L 352 230 L 352 250" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tactical Supersonic Delta Jet Shape (Centered inside safe zone) -->
  <g filter="url(#glow)">
    <!-- Jet Afterburner Plume -->
    <polygon points="256,365 244,405 256,430 268,405" fill="#f97316" opacity="0.9" />
    <polygon points="256,365 248,395 256,412 264,395" fill="#fef08a" opacity="0.95" />

    <!-- Jet Body -->
    <path d="
      M 256 100
      C 260 140 264 190 274 230
      L 380 320
      L 380 342
      L 282 316
      L 282 368
      L 310 395
      L 310 405
      L 256 395
      L 202 405
      L 202 395
      L 230 368
      L 230 316
      L 132 342
      L 132 320
      L 238 230
      C 248 190 252 140 256 100 Z
    " fill="url(#jetGrad)" />

    <!-- Canopy Glass -->
    <path d="
      M 256 160
      C 260 178 261 206 256 226
      C 251 206 252 178 256 160 Z
    " fill="#0284c7" />

    <!-- Leading Edge Highlights -->
    <path d="M 256 100 L 380 320" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <path d="M 256 100 L 132 320" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
  </g>

  <!-- Badge banner MSFS label -->
  <rect x="180" y="440" width="152" height="24" rx="12" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
  <text x="256" y="457" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#e0f2fe" text-anchor="middle">MIL DISPATCH</text>
</svg>
